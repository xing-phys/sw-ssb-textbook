project:
  type: book
  output-dir: _site
  post-render:
    - "python3 scripts/preserve_pdf.py"
  resources:
    - assets/lab.js
    - numerics/data/**
    - numerics/generate.jl
    - numerics/Project.toml
    - numerics/core_checks.jl
    - numerics/check_topology.jl
    - numerics/frontier_diagram.jl
    - figs/*.svg

book:
  title: "Strong-to-Weak Spontaneous Symmetry Breaking"
  subtitle: "From Fundamentals to Research Frontiers"
  author:
    - name: Ze-Yu Xing
      orcid: 0009-0009-5655-0187
      affiliations:
        - Institute of Physics, Chinese Academy of Sciences
        - University of Chinese Academy of Sciences
  date: "2026-10-22"
  date-format: long
  site-url: https://xing-phys.github.io/sw-ssb-textbook/
  repo-url: https://github.com/xing-phys/sw-ssb-textbook
  repo-actions: [source, issue]
  output-file: sw-ssb-textbook
  search:
    type: overlay
    copy-button: true
  downloads: [pdf]
  reader-mode: true
  sidebar:
    title: "SW-SSB · A Quantum Matter Textbook"
    style: docked
    background: light
    collapse-level: 1
    logo: assets/mark.svg
  page-navigation: true
  page-footer:
    left: "SW-SSB · From Fundamentals to Research Frontiers"
    right: "Literature through 22 October 2026 · [Source](https://github.com/xing-phys/sw-ssb-textbook)"
  chapters:
    - index.qmd
    - part: "I · Foundations"
      chapters:
        - 01-quantum-language.qmd
        - 02-statistical-ssb.qmd
        - 03-open-systems.qmd
        - 04-information.qmd
    - part: "II · Strong-to-Weak Order"
      chapters:
        - 05-symmetry.qmd
        - 06-diagnostics.qmd
        - 07-purification.qmd
        - 08-phases-recovery.qmd
        - 09-decoherence.qmd
    - part: "III · Connections and Frontiers"
      chapters:
        - 10-error-correction.qmd
        - 11-mixed-spt.qmd
        - 12-generalized-symmetry.qmd
        - 13-hydrodynamics.qmd
        - 14-charge-scrambling.qmd
        - 15-critical-frontiers.qmd
        - 16-experiments.qmd
    - part: "IV · Working with the Theory"
      chapters:
        - 17-computational-lab.qmd
        - 18-research-problems.qmd
        - 19-literature-map.qmd
  appendices:
    - A-mathematical-toolkit.qmd
    - B-glossary.qmd
    - references.qmd

bibliography: assets/bibliography.bib
csl: assets/american-physics-society.csl
link-citations: true
lang: en
execute:
  enabled: false
crossref:
  chapters: true

format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    fig-responsive: true
    link-external-newwindow: true
    include-in-header: assets/mathjax-config.html
    reference-location: document
    smooth-scroll: true
    grid:
      sidebar-width: 285px
      body-width: 850px
      margin-width: 220px
      gutter-width: 1.6rem
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    latex-auto-install: false
    papersize: a4
    geometry: [margin=24mm]
    fontsize: 10pt
    mainfont: Libertinus Serif
    sansfont: DejaVu Sans
    monofont: DejaVu Sans Mono
    colorlinks: true
    toc: true
    toc-depth: 2
    number-sections: true
    include-in-header: assets/macros.sty
    keep-tex: false
    reference-location: document
    fig-pos: H
