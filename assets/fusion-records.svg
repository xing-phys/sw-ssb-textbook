<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Local charge labels omit intermediate fusion information</title>
<desc id="desc">Four spin half representations combine in pairs through J equal to zero or one. Both choices can fuse to total spin zero.</desc>
<rect width="960" height="390" rx="16" fill="#f6f8fb"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#182d45">
<text x="480" y="40" font-size="23" font-weight="600">The same local charges can fuse differently</text>
<g stroke="#126f79" stroke-width="4" fill="none"><path d="M180 100L300 190L420 100M540 100L660 190L780 100M300 190L480 300L660 190"/></g>
<g fill="#126f79"><circle cx="180" cy="100" r="8"/><circle cx="420" cy="100" r="8"/><circle cx="540" cy="100" r="8"/><circle cx="780" cy="100" r="8"/><circle cx="300" cy="190" r="8"/><circle cx="660" cy="190" r="8"/><circle cx="480" cy="300" r="8"/></g>
<g font-size="21"><text x="180" y="82">½</text><text x="420" y="82">½</text><text x="540" y="82">½</text><text x="780" y="82">½</text></g>
<g font-size="21" font-weight="600" fill="#a44361"><text x="250" y="222">J = 0 or 1</text><text x="710" y="222">J = 0 or 1</text></g>
<text x="480" y="337" font-size="21">Total J = 0 in both singlet states</text>
<text x="480" y="369" font-size="17" fill="#5b6879">A compatible nested-region measurement reveals the intermediate label.</text>
</g></svg>
